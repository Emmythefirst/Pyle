[package]
name = "eligibility-credential"
version = "0.1.0"
description = "Pyle eligibility credential program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "eligibility_credential"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
